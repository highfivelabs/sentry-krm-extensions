      type: boolean

- kind: ProjectSymbolSource
  group: project.sentry.hfl.dev
  version: v1alpha1
  plural: projectsymbolsources
  shape: crud
  create:
    method: POST
    path: /projects/{organization_id_or_slug}/{project_id_or_slug}/symbol-sources/
  read:
    method: GET
    path: /projects/{organization_id_or_slug}/{project_id_or_slug}/symbol-sources/{symbol_source_id}/
  update:
    method: PUT
    path: /projects/{organization_id_or_slug}/{project_id_or_slug}/symbol-sources/{symbol_source_id}/
  delete:
    method: DELETE
    path: /projects/{organization_id_or_slug}/{project_id_or_slug}/symbol-sources/{symbol_source_id}/
  params:
  - name: organization_id_or_slug
    field: organizationIdOrSlug
  - name: project_id_or_slug
    field: projectIdOrSlug
  id:
    param: symbol_source_id
    from: id
  writeOnly:
  - password
  - secretKey
  - privateKey
  terraform:
  - sentry_project_symbol_source
  sample:
    organizationIdOrSlug: example-organization-id-or-slug
    projectIdOrSlug: example-project-id-or-slug
    type: http
    name: example-symbol-source
    url: https://example.com/symbols/
    layout:
      type: native
      casing: default
  required:
  - organizationIdOrSlug
  - projectIdOrSlug
  - type
  - name
  properties:
    organizationIdOrSlug:
      type: string
    projectIdOrSlug:
      type: string
    type:
      type: string
    name:
      type: string
    url:
      type: string
    username:
      type: string
      description: HTTP basic auth username.
    password:
      type: string
      description: HTTP basic auth password.
    bucket:
      type: string
    region:
      type: string
      description: AWS region (for s3).
    accessKey:
      type: string
    secretKey:
      type: string
    prefix:
      type: string
    privateKey:
      type: string
    layout:
      type: object
      description: Directory layout configuration.
      x-kubernetes-preserve-unknown-fields: true

