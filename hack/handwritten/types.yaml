# Hand-written descriptors for Sentry resources absent from openapi-derefed.json.
# Merged into types.yaml, config/crds, and zz_generated.report.md by hack/handwritten/merge.py.
kinds:
- kind: IssueAlert
  group: alert.sentry.hfl.dev
  version: v1alpha1
  plural: issuealerts
  shape: crud
  create:
    method: POST
    path: /projects/{organization_id_or_slug}/{project_id_or_slug}/rules/
  read:
    method: GET
    path: /projects/{organization_id_or_slug}/{project_id_or_slug}/rules/{rule_id}/
  update:
    method: PUT
    path: /projects/{organization_id_or_slug}/{project_id_or_slug}/rules/{rule_id}/
  delete:
    method: DELETE
    path: /projects/{organization_id_or_slug}/{project_id_or_slug}/rules/{rule_id}/
  params:
  - name: organization_id_or_slug
    field: organizationIdOrSlug
  - name: project_id_or_slug
    field: projectIdOrSlug
  id:
    param: rule_id
    from: id
  terraform:
  - sentry_issue_alert
  sample:
    organizationIdOrSlug: example-organization-id-or-slug
    projectIdOrSlug: example-project-id-or-slug
    name: example-issue-alert
    actionMatch: all
    conditions:
    - id: sentry.rules.conditions.first_seen_event.FirstSeenEventCondition
    actions:
    - id: sentry.rules.actions.notify_event.NotifyEventAction
    frequency: 30
  required:
  - organizationIdOrSlug
  - projectIdOrSlug
  - name
  - actionMatch
  - conditions
  - actions
  - frequency
  properties:
    organizationIdOrSlug:
      type: string
    projectIdOrSlug:
      type: string
    name:
      type: string
    actionMatch:
      type: string
    filterMatch:
      type: string
    conditions:
      type: array
      items:
        type: object
        x-kubernetes-preserve-unknown-fields: true
    filters:
      type: array
      items:
        type: object
        x-kubernetes-preserve-unknown-fields: true
    actions:
      type: array
      items:
        type: object
        x-kubernetes-preserve-unknown-fields: true
    frequency:
      type: integer
    environment:
      type: string
    owner:
      type: string

- kind: MetricAlert
  group: alert.sentry.hfl.dev
  version: v1alpha1
  plural: metricalerts
  shape: crud
  create:
    method: POST
    path: /organizations/{organization_id_or_slug}/alert-rules/
  read:
    method: GET
    path: /organizations/{organization_id_or_slug}/alert-rules/{alert_rule_id}/
  update:
    method: PUT
    path: /organizations/{organization_id_or_slug}/alert-rules/{alert_rule_id}/
  delete:
    method: DELETE
    path: /organizations/{organization_id_or_slug}/alert-rules/{alert_rule_id}/
  params:
  - name: organization_id_or_slug
    field: organizationIdOrSlug
  id:
    param: alert_rule_id
    from: id
  terraform:
  - sentry_metric_alert
  - sentry_alert
  sample:
    organizationIdOrSlug: example-organization-id-or-slug
    name: example-metric-alert
    projects:
    - example-project
    query: ""
    aggregate: count()
    timeWindow: 60
    thresholdType: 0
    triggers:
    - label: critical
      alertThreshold: 100
      actions: []
  required:
  - organizationIdOrSlug
  - name
  - projects
  - query
  - aggregate
  - timeWindow
  - thresholdType
  - triggers
  properties:
    organizationIdOrSlug:
      type: string
    name:
      type: string
    projects:
      type: array
      items:
        type: string
    dataset:
      type: string
    eventTypes:
      type: array
      items:
        type: string
    query:
      type: string
    aggregate:
      type: string
    timeWindow:
      type: number
    thresholdType:
      type: integer
    resolveThreshold:
      type: number
    triggers:
      type: array
      items:
        type: object
        x-kubernetes-preserve-unknown-fields: true
    environment:
      type: string
    owner:
      type: string

