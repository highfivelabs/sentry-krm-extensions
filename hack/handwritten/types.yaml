- kind: OrganizationRepository
  group: organization.sentry.hfl.dev
  version: v1alpha1
  plural: organizationrepositories
  shape: crud
  create:
    method: POST
    path: /organizations/{organization_id_or_slug}/repos/
  read:
    method: GET
    path: /organizations/{organization_id_or_slug}/repos/{repository_id}/
  delete:
    method: DELETE
    path: /organizations/{organization_id_or_slug}/repos/{repository_id}/
  params:
  - name: organization_id_or_slug
    field: organizationIdOrSlug
  id:
    param: repository_id
    from: id
  terraform:
  - sentry_organization_repository
  sample:
    organizationIdOrSlug: example-organization-id-or-slug
    provider: integrations:github
    identifier: example-org/example-repo
    installation: "12345"
  required:
  - organizationIdOrSlug
  - provider
  - identifier
  properties:
    organizationIdOrSlug:
      type: string
    provider:
      type: string
    identifier:
      type: string
    installation:
      type: string
      description: Integration installation ID.

- kind: OrganizationCodeMapping
  group: organization.sentry.hfl.dev
  version: v1alpha1
  plural: organizationcodemappings
  shape: crud
  create:
    method: POST
    path: /organizations/{organization_id_or_slug}/code-mappings/
  read:
    method: GET
    path: /organizations/{organization_id_or_slug}/code-mappings/{code_mapping_id}/
  update:
    method: PUT
    path: /organizations/{organization_id_or_slug}/code-mappings/{code_mapping_id}/
  delete:
    method: DELETE
    path: /organizations/{organization_id_or_slug}/code-mappings/{code_mapping_id}/
  params:
  - name: organization_id_or_slug
    field: organizationIdOrSlug
  id:
    param: code_mapping_id
    from: id
  terraform:
  - sentry_organization_code_mapping
