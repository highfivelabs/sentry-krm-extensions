#
# How krm-registry (registry.highfivelabs.dev) shows this provider. Its build
# reads this file from main (krm-registry config.py has the format).
#
# install: the provider page's Install card, one entry per variant. A variant
# with oci: names where the chart is published on cr.highfivelabs.dev; the
# registry shows it only once that chart is published, at the newest
# release-shaped tag there ({version}). Until then the page has no card.
schema: 1
install:
  - name: High Five Labs chart
    oci: charts/sentry-krm-extensions
    note: >-
      Installs the CRDs and the manager in sentry-krm-extensions-system. Then, in each namespace that manages
      Sentry, a Secret (token) and a Connection named default, as below;
      objects use it unless spec.connectionRef.name names another.
    steps: |
      helm install sentry-krm-extensions oci://cr.highfivelabs.dev/charts/sentry-krm-extensions \
        --version {version} \
        --namespace sentry-krm-extensions-system --create-namespace

      kubectl apply -f - <<'EOF'
      apiVersion: v1
      kind: Secret
      metadata:
        name: sentry-credentials
        namespace: team-a
      stringData:
        token: <token>
      ---
      apiVersion: core.sentry.hfl.dev/v1alpha1
      kind: Connection
      metadata:
        name: default
        namespace: team-a
      spec:
        baseURL: https://us.sentry.io/api/0
        secretRef:
          name: sentry-credentials
      EOF
